<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portiva — Activity. Utility. Rewards.</title>
  <style>
    :root {
      --navy: #070f1a;
      --navy-2: #0b1a2e;
      --gold: #d4af37;
      --gold-soft: #e8c96a;
      --teal: #00c2c7;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--navy);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Animated background glow */
    .bg-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 194, 199, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.09) 0%, transparent 40%);
      z-index: -1;
      animation: bgMove 18s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.1) translate(-2%, 2%); }
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ===== HERO ===== */
    header {
      padding: 70px 0 50px;
      text-align: center;
    }

    .logo-img {
      max-width: 320px;
      width: 100%;
      margin: 0 auto 30px;
      display: block;
      filter: drop-shadow(0 0 30px rgba(0, 194, 199, 0.25));
      animation: logoFloat 6s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .tagline {
      font-size: 1.15rem;
      color: var(--teal);
      letter-spacing: 3px;
      margin-bottom: 18px;
      font-weight: 500;
    }

    .subtitle {
      max-width: 580px;
      margin: 0 auto 36px;
      color: var(--muted);
      font-size: 1.08rem;
    }

    .buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal), #009aa0);
      color: white;
      box-shadow: 0 4px 24px rgba(0, 194, 199, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(0, 194, 199, 0.5);
    }

    .btn-secondary {
      border: 1.5px solid var(--gold);
      color: var(--gold);
      background: transparent;
    }

    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.12);
      transform: translateY(-3px);
    }

    /* ===== SECTIONS ===== */
    section {
      margin: 40px 0;
      padding: 36px 32px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(212, 175, 55, 0.12);
      border-radius: 18px;
      backdrop-filter: blur(8px);
      transition: border-color 0.3s ease;
    }

    section:hover {
      border-color: rgba(0, 194, 199, 0.25);
    }

    h2 {
      font-size: 1.55rem;
      color: var(--gold);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h2::before {
      content: '';
      width: 4px;
      height: 22px;
      background: var(--teal);
      border-radius: 2px;
    }

    p {
      color: var(--muted);
      margin-bottom: 12px;
      font-size: 1.02rem;
    }

    strong {
      color: var(--text);
    }

    /* ===== ENGINE MAVIS ===== */
    .engine-box {
      margin-top: 24px;
      background: linear-gradient(145deg, rgba(0, 194, 199, 0.07), rgba(212, 175, 55, 0.04));
      border: 1px solid rgba(0, 194, 199, 0.22);
      border-radius: 14px;
      padding: 24px;
    }

    .engine-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .engine-live {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--teal);
      font-weight: 600;
      font-size: 1.05rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 14px #22c55e;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 14px;
    }

    .metric {
      background: rgba(0, 0, 0, 0.28);
      border-radius: 12px;
      padding: 16px 12px;
      text-align: center;
    }

    .metric-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .metric-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ===== ROADMAP ===== */
    .stage {
      margin-bottom: 26px;
      padding-left: 18px;
      border-left: 2px solid rgba(0, 194, 199, 0.35);
    }

    .stage h3 {
      color: var(--teal);
      font-size: 1.12rem;
      margin-bottom: 6px;
    }

    .stage em {
      color: var(--gold-soft);
      font-style: normal;
      font-size: 0.93rem;
    }
